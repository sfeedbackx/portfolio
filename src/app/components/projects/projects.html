<div>
  <div class="space-y-3.5">
    <h2 class="text-2xl italic font-bold font-jetBrains text-frost-2">About Me</h2>
    <div class="flex  gap-4 max-sm:justify-between flex-col sm:flex-row ">
      @for(pro of projects; track pro.name){
      <div class="max-sm:w-full w-3xs  h-80 items-start flex flex-col  border-snow-storm-2  border rounded-xl
          py-4 px-4
        overflow-hidden  shadow-[inset_0_-20px_20px_-20px_#ECEFF480]
        hover:shadow-[inset_0_-15px_20px_-2px_#ECEFF480]">
        <img [src]="pro.img" [alt]="pro.alt" class="w-full max-sm:h-48 h-32  border-snow-storm-2 border rounded-lg">
        <div class="mt-1 font-jetBrains font-medium text-lg text-snow-storm-2">
            {{capitalizeFirstLetter(pro.name)}}
        </div>
        <div class="mt-2 font-jetBrains line-clamp-4 text-sm text-snow-storm-2">
          {{`${pro.name}`}}
        </div>
      </div>
      }

    </div>

  </div>
</div>
