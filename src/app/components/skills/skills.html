<div>
  <div class="flex flex-col gap-5">
    <h2 class="text-2xl italic font-bold font-jetBrains text-frost-2">{{technologiesTitle()}}</h2>
    <div class="flex flex-row gap-5 flex-wrap max-w-[43.75rem]">

@for(tech of technologies; track tech.name) {
  <div
    class="w-[6.25rem] h-[2.8125rem] flex border-snow-storm-2 border rounded-lg justify-center items-center">
    <img
      [src]="tech.image"
      [alt]="tech.alt"
      [ngClass]="tech.size"
      class="object-cover snow-filter">
  </div>
} @empty {
  <p class="text-snow-storm-2">No technologies to display</p>
}
  </div>
</div>
